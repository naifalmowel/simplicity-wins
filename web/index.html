<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simplicity Wins | ملابس عصرية في التل، ريف دمشق">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Simplicity Wins">
  <link rel="apple-touch-icon" href="logo.webp">

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="logo.webp"/>

  <title>Simplicity Wins | سيمليسيتي وينز</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F7F6F2;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 76px;
      height: 76px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 18px;
      animation: pulse 1.6s infinite ease-in-out;
    }
    .brand-title {
      color: #171715;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .brand-slogan {
      color: #676B56;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #E8E6E0;
      border-top: 2px solid #171715;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <img src="logo.webp" alt="Simplicity Wins Logo" class="logo-img">
    <div class="brand-title">SIMPLICITY WINS</div>
    <div class="brand-slogan">SIMPLICITY ALWAYS WINS</div>
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
